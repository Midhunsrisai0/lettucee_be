name: CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: lettucee-be-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated migrations are committed
        shell: bash
        run: |
          npm run db:generate
          if [[ -n "$(git status --porcelain migrations)" ]]; then
            echo "Generated migration changes detected. Run 'npm run db:generate' locally and commit both migrations/*.sql and migrations/meta/*."
            git status --short migrations
            exit 1
          fi

      - name: Run typecheck
        run: npm run typecheck

  deploy:
    name: Migrate Remote D1 + Deploy Worker
    runs-on: ubuntu-latest
    needs: [typecheck]
    if: github.event_name == 'workflow_dispatch'
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply remote migrations
        run: npx wrangler d1 migrations apply lettucee-db --remote

      - name: Deploy Worker
        run: npm run deploy
